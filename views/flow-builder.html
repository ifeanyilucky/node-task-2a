<div
  class="min-h-screen bg-gradient-to-b from-purple-50/30 to-indigo-50/30 py-8"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <!-- Flow List Section -->
    <div
      class="bg-white rounded-2xl shadow-lg p-6 mb-8 border border-purple-100"
    >
      <div
        class="flex justify-between items-center mb-6 pb-4 border-b border-purple-100"
      >
        <h2 class="text-xl font-semibold text-purple-900">Flow Builder</h2>
        <button
          id="createFlowBtn"
          class="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200 flex items-center gap-2 font-medium"
        >
          Create New Flow
        </button>
      </div>

      <!-- Flow List -->
      <div id="flowList" class="space-y-4">
        <!-- Flows will be populated here -->
      </div>
    </div>

    <!-- Flow Details Modal -->
    <div
      id="flowModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >
      <div
        class="bg-white rounded-2xl shadow-lg max-w-2xl w-full mx-4 p-6 border border-purple-100"
      >
        <h3
          class="text-xl font-semibold text-purple-900 mb-4 pb-4 border-b border-purple-100"
        >
          Create New Flow
        </h3>
        <form id="flowForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1"
              >Flow Name</label
            >
            <input
              type="text"
              name="name"
              class="w-full px-4 py-3 bg-purple-50 border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1"
              >Description</label
            >
            <textarea
              name="description"
              class="w-full px-4 py-3 bg-purple-50 border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              rows="3"
            ></textarea>
          </div>

          <!-- Task Builder -->
          <div class="space-y-4">
            <label class="block text-sm font-medium text-purple-900"
              >Tasks</label
            >
            <div id="taskList" class="space-y-3">
              <!-- Tasks will be added here -->
            </div>
            <button
              type="button"
              id="addTaskBtn"
              class="text-sm text-purple-600 hover:text-purple-700 font-medium flex items-center gap-1"
            >
              <span class="text-lg">+</span> Add Task
            </button>
          </div>

          <div
            class="flex justify-end space-x-3 pt-4 border-t border-purple-100"
          >
            <button
              type="button"
              id="cancelFlowBtn"
              class="px-6 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 active:scale-95 transition-all duration-200"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200"
            >
              Create Flow
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Task Input Modal -->
    <div
      id="taskInputModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >
      <div
        class="bg-white rounded-2xl shadow-lg max-w-md w-full mx-4 p-6 border border-purple-100"
      >
        <h3
          class="text-lg font-semibold text-purple-900 mb-4 pb-4 border-b border-purple-100"
        >
          Enter Task Input
        </h3>
        <form id="taskInputForm" class="space-y-4">
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1"
              >Input Value</label
            >
            <input
              type="text"
              id="taskInput"
              class="w-full px-4 py-3 bg-purple-50 border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              required
            />
          </div>
          <div class="flex justify-end space-x-3">
            <button
              type="button"
              onclick="closeTaskInputModal()"
              class="px-6 py-3 bg-gray-100 text-gray-700 rounded-xl hover:bg-gray-200 active:scale-95 transition-all duration-200"
            >
              Cancel
            </button>
            <button
              type="submit"
              class="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200"
            >
              Execute Task
            </button>
          </div>
        </form>
      </div>
    </div>

    <!-- Webhook Info Modal -->
    <div
      id="webhookInfoModal"
      class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center"
    >
      <div
        class="bg-white rounded-2xl shadow-lg max-w-2xl w-full mx-4 p-6 border border-purple-100"
      >
        <div
          class="flex justify-between items-center mb-4 pb-4 border-b border-purple-100"
        >
          <h3 class="text-lg font-semibold text-purple-900">
            Webhook Information
          </h3>
          <button
            onclick="closeWebhookModal()"
            class="text-gray-400 hover:text-gray-600"
          >
            ×
          </button>
        </div>

        <div class="space-y-6">
          <!-- Webhook URL Section -->
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-2"
              >Webhook URL</label
            >
            <div class="flex gap-2">
              <input
                type="text"
                id="webhookUrl"
                readonly
                class="flex-1 px-4 py-3 bg-purple-50 border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              />
              <button
                onclick="copyWebhookUrl()"
                class="px-4 py-2 bg-purple-100 text-purple-700 rounded-xl hover:bg-purple-200 transition-all duration-200"
              >
                Copy
              </button>
            </div>
          </div>

          <!-- Click Trigger Example -->
          <div class="bg-purple-50/50 rounded-xl p-6 space-y-4">
            <h4 class="text-sm font-semibold text-purple-900">
              Click Trigger Example
            </h4>
            <div class="space-y-2">
              <input
                type="text"
                id="testInput"
                placeholder="Enter test input..."
                class="w-full px-4 py-3 bg-white border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              />
              <button
                onclick="testWebhook()"
                class="w-full px-4 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200"
              >
                Test Webhook
              </button>
            </div>
            <p class="text-sm text-gray-600">
              Try it out: Enter a test value and click the button to trigger the
              webhook.
            </p>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }

  .custom-scrollbar::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
  }

  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 10px;
  }

  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }
</style>

<script>
  let currentFlowId = null;

  // Add these new functions at the beginning of the script
  const showFlowModal = () => {
    document.getElementById("flowModal").classList.remove("hidden");
  };

  const closeFlowModal = () => {
    document.getElementById("flowModal").classList.add("hidden");
    document.getElementById("flowForm").reset();
  };

  // Flow list item template
  const createFlowListItem = (flow) => `
  <div class="bg-white border-2 border-purple-100 rounded-2xl p-6 hover:shadow-lg transition-all duration-200">
    <div class="flex justify-between items-start mb-4">
      <div>
        <h3 class="text-lg font-medium text-purple-900">${flow.name}</h3>
        <p class="text-sm text-gray-500">${
          flow.description || "No description"
        }</p>
      </div>
      <div class="space-x-2">
        <button 
          onclick="showWebhookInfo('${flow.webhookToken}')"
          class="px-4 py-2 bg-purple-50 text-purple-700 rounded-xl hover:bg-purple-100 transition-all duration-200"
        >
          Webhook
        </button>
        <button 
          onclick="showTaskInput('${flow.id}')"
          class="px-4 py-2 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200"
        >
          Execute
        </button>
      </div>
    </div>
    <div class="space-y-2 bg-gradient-to-b from-purple-50/50 to-indigo-50/50 rounded-xl p-4">
      ${flow.tasks
        .map(
          (task, index) => `
        <div class="flex items-center text-sm text-gray-600">
          <span class="w-6 h-6 flex items-center justify-center bg-purple-100 text-purple-600 rounded-full mr-2 font-medium">
            ${index + 1}
          </span>
          ${task.name} (${task.type})
        </div>
      `
        )
        .join("")}
    </div>
  </div>
`;

  // Load flows
  const loadFlows = async () => {
    try {
      const response = await fetch("/flows");
      const flows = await response.json();
      document.getElementById("flowList").innerHTML = flows
        .map(createFlowListItem)
        .join("");
    } catch (error) {
      console.error("Error loading flows:", error);
    }
  };

  // Show webhook info
  const showWebhookInfo = (token) => {
    const url = `${window.location.origin}/webhook/${token}?payload=your_input_here`;
    document.getElementById("webhookUrl").value = url;
    document.getElementById("webhookInfoModal").classList.remove("hidden");
  };

  // Show task input modal
  const showTaskInput = (flowId) => {
    currentFlowId = flowId;
    document.getElementById("taskInputModal").classList.remove("hidden");
  };

  // Close task input modal
  const closeTaskInputModal = () => {
    document.getElementById("taskInputModal").classList.add("hidden");
    currentFlowId = null;
  };

  // Handle task execution
  document
    .getElementById("taskInputForm")
    .addEventListener("submit", async (e) => {
      e.preventDefault();

      const input = document.getElementById("taskInput").value;
      try {
        const response = await fetch(
          `/webhook/${currentFlowId}?payload=${encodeURIComponent(input)}`
        );
        const result = await response.json();

        if (result.success) {
          alert("Flow executed successfully!");
        } else {
          alert(`Error: ${result.error}`);
        }
      } catch (error) {
        console.error("Error executing flow:", error);
        alert("Failed to execute flow. Please try again.");
      }

      closeTaskInputModal();
    });

  // Add this task template function after createFlowListItem
  const createTaskElement = (taskIndex) => `
    <div class="task-item bg-purple-50 p-4 rounded-xl border-2 border-purple-100">
      <div class="flex justify-between items-start gap-4">
        <div class="flex-1 space-y-3">
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1">Task Name</label>
            <input
              type="text"
              name="tasks[${taskIndex}][name]"
              class="w-full px-3 py-2 bg-white border-2 border-purple-100 rounded-lg focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              required
            />
          </div>
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1">Task Type</label>
            <select
              name="tasks[${taskIndex}][type]"
              class="w-full px-3 py-2 bg-white border-2 border-purple-100 rounded-lg focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              required
            >
              <option value="">Select Type</option>
              <option value="http">HTTP Request</option>
              <option value="email">Send Email</option>
              <option value="notification">Send Notification</option>
            </select>
          </div>
          <div>
            <label class="block text-sm font-medium text-purple-900 mb-1">Default Input</label>
            <input
              type="text"
              name="tasks[${taskIndex}][defaultInput]"
              class="w-full px-3 py-2 bg-white border-2 border-purple-100 rounded-lg focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200"
              placeholder="Optional default input for this task"
            />
          </div>
        </div>
        <button
          type="button"
          onclick="removeTask(this)"
          class="text-gray-400 hover:text-red-500 transition-colors duration-200"
        >
          ×
        </button>
      </div>
    </div>
  `;

  // Add these new functions before the event listeners
  let taskCounter = 0;

  const addTask = () => {
    const taskList = document.getElementById("taskList");
    taskList.insertAdjacentHTML("beforeend", createTaskElement(taskCounter++));
  };

  const removeTask = (button) => {
    button.closest(".task-item").remove();
  };

  // Update the flow form submission handler to include tasks
  document.getElementById("flowForm").addEventListener("submit", async (e) => {
    e.preventDefault();

    const formData = new FormData(e.target);
    const tasks = [];

    // Collect all task data
    const taskElements = document.querySelectorAll(".task-item");
    taskElements.forEach((taskElement, index) => {
      tasks.push({
        name: formData.get(`tasks[${index}][name]`),
        type: formData.get(`tasks[${index}][type]`),
        defaultInput: formData.get(`tasks[${index}][defaultInput]`),
      });
    });

    const flowData = {
      name: formData.get("name"),
      description: formData.get("description"),
      tasks: tasks,
    };

    try {
      const response = await fetch("/flows", {
        method: "POST",
        headers: {
          "Content-Type": "application/json",
        },
        body: JSON.stringify(flowData),
      });

      if (response.ok) {
        await loadFlows();
        closeFlowModal();
      } else {
        alert("Failed to create flow. Please try again.");
      }
    } catch (error) {
      console.error("Error creating flow:", error);
      alert("Failed to create flow. Please try again.");
    }
  });

  // Add click handler for the Add Task button
  document.getElementById("addTaskBtn").addEventListener("click", addTask);

  // Add event listeners for the create flow functionality
  document.addEventListener("DOMContentLoaded", () => {
    loadFlows();

    // Create Flow button click handler
    document
      .getElementById("createFlowBtn")
      .addEventListener("click", showFlowModal);

    // Cancel button click handler
    document
      .getElementById("cancelFlowBtn")
      .addEventListener("click", closeFlowModal);
  });

  // Add new webhook related functions
  const closeWebhookModal = () => {
    document.getElementById("webhookInfoModal").classList.add("hidden");
  };

  const copyWebhookUrl = () => {
    const webhookUrl = document.getElementById("webhookUrl");
    webhookUrl.select();
    document.execCommand("copy");

    // Show temporary success message
    const copyButton = event.target;
    const originalText = copyButton.textContent;
    copyButton.textContent = "Copied!";
    setTimeout(() => {
      copyButton.textContent = originalText;
    }, 2000);
  };

  const testWebhook = async () => {
    const input = document.getElementById("testInput").value;
    if (!input) {
      alert("Please enter a test input value");
      return;
    }

    try {
      const token = document
        .getElementById("webhookUrl")
        .value.split("/webhook/")[1]
        .split("?")[0];
      const response = await fetch(
        `/webhook/${token}?payload=${encodeURIComponent(input)}`
      );
      const result = await response.json();

      if (result.success) {
        alert("Webhook tested successfully!");
      } else {
        alert(`Error: ${result.error}`);
      }
    } catch (error) {
      console.error("Error testing webhook:", error);
      alert("Failed to test webhook. Please try again.");
    }
  };
</script>
