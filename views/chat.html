<div class="max-w-4xl mx-auto p-4 min-h-screen">
  <div
    class="bg-white rounded-2xl shadow-lg p-6 space-y-4 border border-purple-100"
  >
    <!-- Chat Header -->
    <div
      class="flex items-center justify-between pb-4 border-b border-purple-100"
    >
      <h1 class="text-xl font-semibold text-purple-900">Chat Interface</h1>
      <div class="h-2 w-2 rounded-full bg-green-400 animate-pulse"></div>
    </div>

    <!-- Messages Container -->
    <div
      class="h-[500px] overflow-y-auto rounded-xl bg-gradient-to-b from-purple-50/50 to-indigo-50/50 p-4 custom-scrollbar"
    >
      <ul id="messageList" class="space-y-4">
        <!-- Messages will appear here -->
      </ul>
    </div>

    <!-- Input Area -->
    <div class="flex gap-3">
      <div class="flex-1 relative">
        <input
          type="text"
          id="messageInput"
          class="w-full px-4 py-3 bg-purple-50 border-2 border-purple-100 rounded-xl focus:ring-2 focus:ring-purple-400 focus:border-purple-400 transition-all duration-200 pr-12"
          placeholder="Type your message..."
        />
      </div>
      <button
        id="sendButton"
        class="px-6 py-3 bg-purple-600 text-white rounded-xl hover:bg-purple-700 active:scale-95 transition-all duration-200 disabled:opacity-50 disabled:hover:bg-purple-600 disabled:active:scale-100 flex items-center gap-2 font-medium"
      >
        <span>Send</span>
        <div
          id="sendSpinner"
          class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"
        ></div>
      </button>
    </div>

    <button
      id="saveButton"
      class="w-full px-4 py-3 bg-indigo-600 text-white rounded-xl hover:bg-indigo-700 active:scale-95 transition-all duration-200 disabled:opacity-50 disabled:hover:bg-indigo-600 disabled:active:scale-100 flex items-center justify-center gap-2 font-medium"
    >
      <span>Save Chat History</span>
      <div
        id="saveSpinner"
        class="hidden animate-spin h-4 w-4 border-2 border-white border-t-transparent rounded-full"
      ></div>
    </button>
  </div>
</div>

<style>
  .custom-scrollbar::-webkit-scrollbar {
    width: 6px;
  }

  .custom-scrollbar::-webkit-scrollbar-track {
    background: #f1f1f1;
    border-radius: 10px;
  }

  .custom-scrollbar::-webkit-scrollbar-thumb {
    background: #d1d5db;
    border-radius: 10px;
  }

  .custom-scrollbar::-webkit-scrollbar-thumb:hover {
    background: #9ca3af;
  }
</style>

<script>
  let currentVersion = 0;
  let isPolling = false;

  // Load initial messages
  async function loadMessages() {
    try {
      const response = await fetch("/chat/all");
      const data = await response.json();
      updateMessageList(data.messages);
    } catch (error) {
      console.error("Error loading messages:", error);
    }
  }

  // Update message list with new styling
  function updateMessageList(messages) {
    const messageList = document.getElementById("messageList");
    messageList.innerHTML = messages
      .map(
        (msg) => `
          <li class="flex flex-col ${msg.isUser ? "items-end" : "items-start"}">
            <div class="max-w-[80%] break-words">
              <div class="${
                msg.isUser
                  ? "bg-purple-600 text-white"
                  : "bg-white border-2 border-purple-100 text-gray-800"
              } px-4 py-2 rounded-2xl ${
          msg.isUser ? "rounded-tr-none" : "rounded-tl-none"
        } shadow-sm">
                <div class="text-sm">${msg.text}</div>
              </div>
              <div class="text-xs text-gray-500 mt-1 ${
                msg.isUser ? "text-right" : "text-left"
              }">
                ${new Date(msg.timestamp).toLocaleString()}
              </div>
            </div>
          </li>
        `
      )
      .join("");
    messageList.scrollTop = messageList.scrollHeight;
  }

  // Send message
  async function sendMessage() {
    const input = document.getElementById("messageInput");
    const message = input.value.trim();
    const sendButton = document.getElementById("sendButton");
    const sendSpinner = document.getElementById("sendSpinner");

    if (!message) return;

    // Show loading state
    sendButton.disabled = true;
    sendSpinner.classList.remove("hidden");

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const response = await fetch("/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ message }),
        signal: controller.signal,
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        input.value = "";
        await loadMessages();
      } else {
        const error = await response.json();
        throw new Error(error.error || "Failed to send message");
      }
    } catch (error) {
      console.error("Error sending message:", error);
      if (error.name === "AbortError") {
        alert("Request timed out. Please try again.");
      } else {
        alert(error.message || "Failed to send message. Please try again.");
      }
    } finally {
      sendButton.disabled = false;
      sendSpinner.classList.add("hidden");
    }
  }

  // Save chat history
  async function saveChat() {
    const saveButton = document.getElementById("saveButton");
    const saveSpinner = document.getElementById("saveSpinner");

    saveButton.disabled = true;
    saveSpinner.classList.remove("hidden");

    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 5000);

      const response = await fetch("/save", {
        method: "POST",
        signal: controller.signal,
      });

      clearTimeout(timeoutId);

      if (response.ok) {
        const result = await response.json();
        if (result.success) {
          alert("Chat history saved successfully!");
        } else {
          throw new Error("Failed to save chat");
        }
      } else {
        const error = await response.json();
        throw new Error(error.error || "Failed to save chat");
      }
    } catch (error) {
      console.error("Error saving chat:", error);
      if (error.name === "AbortError") {
        alert("Save request timed out. Please try again.");
      } else {
        alert(error.message || "Failed to save chat history");
      }
    } finally {
      saveButton.disabled = false;
      saveSpinner.classList.add("hidden");
    }
  }

  // Long polling function
  async function pollMessages() {
    if (isPolling) return;

    isPolling = true;
    try {
      const controller = new AbortController();
      const timeoutId = setTimeout(() => controller.abort(), 31000); // 31 second timeout

      const response = await fetch(`/poll?version=${currentVersion}`, {
        signal: controller.signal,
      });

      clearTimeout(timeoutId);

      if (response.status === 200) {
        const data = await response.json();
        currentVersion = data.version;
        await loadMessages();
      }
    } catch (error) {
      if (error.name !== "AbortError") {
        console.error("Polling error:", error);
      }
    } finally {
      isPolling = false;
      setTimeout(() => pollMessages(), 1000);
    }
  }

  // Event listeners
  document.getElementById("sendButton").addEventListener("click", sendMessage);
  document.getElementById("messageInput").addEventListener("keypress", (e) => {
    if (e.key === "Enter") sendMessage();
  });
  document.getElementById("saveButton").addEventListener("click", saveChat);

  // Initialize
  loadMessages();
  pollMessages();
</script>
